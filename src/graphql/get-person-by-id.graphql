query GetPersonById($recordId: String!) {
  person(id: $recordId) {
    name {
      first_name
      last_name
      full_name
    }
    email_addresses
    phone_numbers
    company {
      name
    }
    linkedin: attribute(slug: "linkedin") {
      __typename
      ... on TextValue {
        value
      }
    }
    facebook: attribute(slug: "facebook") {
      __typename
      ... on TextValue {
        value
      }
    }
  }
}
